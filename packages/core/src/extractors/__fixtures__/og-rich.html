<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>OG Rich Page — Fallback Title</title>
	<meta name="description" content="Fallback description used only when og:description is missing.">
	<meta property="og:title" content="OG Rich Page">
	<meta property="og:description" content="Full Open Graph fixture for extractor tests.">
	<meta property="og:site_name" content="MetaScan Docs">
	<meta property="og:type" content="article">
	<meta property="og:url" content="https://example.metascan.dev/og-rich">
	<meta property="og:image" content="https://example.metascan.dev/og-rich/cover.png">
	<meta property="og:image:alt" content="OG rich cover image">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
</head>
<body>
	<h1>OG Rich Page</h1>
	<p>Page body intentionally minimal; the extractor reads only the head.</p>
	<img src="/local/photo.png" alt="a local scene">
</body>
</html>
